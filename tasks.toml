#
# Repo-local tasks, included after the toolchain's common tasks and the
# containers archetype: the manifests validation harness and the terraform
# module test suites. lint is the archetype's (license headers, prose,
# actionlint + zizmor, shell, and the kustomize config scans through the
# lint-kustomize replacement below); fmt is common's plus terraform fmt. The
# archetype's build (`patchy build --all --dry-run`) packages the manifests
# artifact patchy.yaml describes without publishing it, and common's
# docs-build builds the documentation site (zensical.toml + docs/).

[test]
description = "render + schema-validate the manifests, then terraform test the modules"
run = [{ task = "test-manifests" }, { task = "test-modules" }]

# The harness renders through the archetype's Flux helpers
# (.mise/archetypes/containers/scripts/flux-substitute.sh and kubeconform.sh).
[test-manifests]
description = "kustomize build, cluster-vars + github-arc-vars substitution, resourceset render, kubeconform"
dir = "{{config_root}}"
run = "./scripts/validate.sh"

# modules/aws and modules/google call the cluster modules' modules/application
# (and, on google, modules/node-pool) from git, so init needs network (the
# providers are mocked, nothing else is reached).
[test-modules]
description = "terraform test (mocked providers) for modules/aws and modules/google"
dir = "{{config_root}}"
run = """
set -eu
for dir in modules/aws modules/google; do
  echo "==> $dir"
  {{vars.terraform_binary}} -chdir="$dir" init -backend=false -input=false > /dev/null
  {{vars.terraform_binary}} -chdir="$dir" validate
  {{vars.terraform_binary}} -chdir="$dir" test
done
"""

[fmt-terraform]
hide = true
dir = "{{config_root}}"
run = "{{vars.terraform_binary}} fmt -recursive modules"

[fmt]
description = "format prose and terraform, inject license headers"
run = [{ task = "fmt-prose" }, { task = "fmt-terraform" }, { task = "license" }]

# Repo-local replacement for the toolchain's lint-kustomize: kubescape
# fatals on directories that contain ONLY custom resources it cannot map.
# manifests/common is CRs plus a Namespace; the per-cloud trees carry the
# ServiceAccounts and scheduling ConfigMaps kubescape can score.
[lint-kustomize]
hide = true
dir = "{{config_root}}"
env = { KUBESCAPE_SEVERITY = "{{vars.kubescape_severity}}" }
run = """
set -eu
export KUBECONFIG=/nonexistent
for d in manifests/aws/ manifests/google/; do
  echo "lint-kustomize: kubescape scan $d"
  kubescape scan "$d" --logger warning --severity-threshold "${KUBESCAPE_SEVERITY:-high}" --exceptions .kubescape/exceptions.json
done
"""

# The archetype's ci and pr, with the harness and module tests added: the
# reusable CI runs lint, test and build as jobs of their own.
[ci]
description = "the checks the reusable CI workflow runs"
run = [{ task = "lint" }, { task = "test" }, { task = "build" }, { task = "docs-build" }]

[pr]
description = "full local gate before a pull request"
run = [
  { task = "fmt" },
  { task = "lint" },
  { task = "test" },
  { task = "build" },
  { task = "docs-build" },
  { task = "commit" },
]
