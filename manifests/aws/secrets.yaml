# AWS Secrets Manager -> the GitHub App credential every scale set reads
# (githubConfigSecret: github-arc-github-app), in the aws dialect: the
# Secrets Store CSI driver's AWS provider (the
# aws-secrets-store-csi-driver-provider EKS add-on) plus the upstream
# secrets-store-sync-controller the platform deploys as the secret-sync
# component - provider aws with IRSA (the syncs are podless, so Pod
# Identity's pod-bound token exchange can never succeed), objectNames in
# Secrets Manager, SecretSync from secret-sync.x-k8s.io/v1alpha1, run as the
# github-arc-secrets KSA (service-accounts.yaml).
#
# Plain objects rather than patchy's ResourceSet: the sync is unconditional,
# so there is nothing to gate. The three secrets are created (or, with
# create_secrets = false, expected to exist) by modules/aws under the
# cluster's SECRET_PREFIX; their values are put out of band. The target
# keys are the ones ARC reads from a pre-defined GitHub App secret.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: github-arc-github-app
  namespace: github-arc
spec:
  provider: aws
  parameters:
    region: ${AWS_REGION}
    usePodIdentity: "false"
    objects: |
      - objectName: "${SECRET_PREFIX}github-arc-app-id"
        objectType: "secretsmanager"
        objectAlias: "app-id"
      - objectName: "${SECRET_PREFIX}github-arc-installation-id"
        objectType: "secretsmanager"
        objectAlias: "installation-id"
      - objectName: "${SECRET_PREFIX}github-arc-private-key"
        objectType: "secretsmanager"
        objectAlias: "private-key.pem"
---
apiVersion: secret-sync.x-k8s.io/v1alpha1
kind: SecretSync
metadata:
  name: github-arc-github-app
  namespace: github-arc
spec:
  serviceAccountName: github-arc-secrets
  secretProviderClassName: github-arc-github-app
  secretObject:
    type: Opaque
    data:
      - sourcePath: app-id
        targetKey: github_app_id
      - sourcePath: installation-id
        targetKey: github_app_installation_id
      - sourcePath: private-key.pem
        targetKey: github_app_private_key
