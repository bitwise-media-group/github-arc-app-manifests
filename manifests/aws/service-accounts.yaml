# The identity the GitHub App secret sync runs as. modules/aws (through
# modules/application's secret_readers) mints the podless IRSA reader role
# <cluster>-secrets-github-arc-github-arc-secrets, scoped to
# ${SECRET_PREFIX}* - IRSA rather than Pod Identity because the syncs are
# podless (see the platform's secret-sync component) - and the role-arn
# annotation below, ${SECRETS_ROLE_PREFIX}<ns>-<sa>, is how the AWS provider
# finds it. The name is the contract with modules/aws's secret reader -
# change them together or the grant silently stops matching.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-arc-secrets
  namespace: github-arc
  annotations:
    eks.amazonaws.com/role-arn: ${SECRETS_ROLE_PREFIX}github-arc-github-arc-secrets
