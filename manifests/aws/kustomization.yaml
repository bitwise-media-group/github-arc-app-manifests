#
# The aws tree (what the seed applies on EKS): the cloud-neutral core, the
# aws secret-sync dialect - Secrets Store CSI
# SecretProviderClass + secrets-store-sync SecretSync, run as the
# github-arc-secrets KSA whose IRSA reader role modules/aws mints (through
# terraform-aws-eks-flux's modules/application) - and the runners' dedicated
# capacity: one Karpenter NodePool per elected arch on the platform's shared
# EC2NodeClass default, plus the scheduling that pins each scale set to it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../common
  - service-accounts.yaml
  - secrets.yaml
  - scheduling.yaml
  - resourceset-nodes.yaml
