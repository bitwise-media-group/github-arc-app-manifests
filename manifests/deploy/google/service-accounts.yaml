# The identity the GitHub App secret sync runs as. It holds direct Workload
# Identity grants (roles/secretmanager.secretAccessor on each of the three
# containers, as the federated principal ns/github-arc/sa/github-arc-secrets)
# that modules/google makes beside (or, with create_secrets = false, on)
# the containers; the secret VERSIONS are added out of band and never touch
# terraform state. The name is the contract with modules/google - change
# them together or the grants silently stop matching.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-arc-secrets
  namespace: github-arc
