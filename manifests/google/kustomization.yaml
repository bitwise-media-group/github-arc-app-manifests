#
# The google tree (what the seed applies on GKE): the cloud-neutral core,
# the google secret-sync dialect (GKE Integrated
# Secret Synchronization, run as the github-arc-secrets KSA whose accessor
# grants modules/google makes), and the runner pods' scheduling onto the
# github-arc-<arch> GKE node pools modules/google creates.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../common
  - service-accounts.yaml
  - secrets.yaml
  - scheduling.yaml
