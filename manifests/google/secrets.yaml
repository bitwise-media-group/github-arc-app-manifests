# Google Secret Manager -> the GitHub App credential every scale set reads
# (githubConfigSecret: github-arc-github-app), in the google dialect: GKE
# Integrated Secret Synchronization (enabled by the gke module's
# secret_sync toggle) - provider gke, resourceNames in the GCP_PROJECT
# project, SecretSync from secret-sync.gke.io/v1, run as the
# github-arc-secrets KSA (service-accounts.yaml).
#
# Plain objects rather than patchy's ResourceSet: the sync is unconditional
# (every elected scale set needs the App), so there is nothing to gate. The
# three containers are created (or, with create_secrets = false, only
# granted) by modules/google under the cluster's SECRET_PREFIX; their
# versions are added out of band. The target keys are the ones ARC reads
# from a pre-defined GitHub App secret.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: github-arc-github-app
  namespace: github-arc
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT}/secrets/${SECRET_PREFIX}github-arc-app-id/versions/latest"
        path: "app-id"
      - resourceName: "projects/${GCP_PROJECT}/secrets/${SECRET_PREFIX}github-arc-installation-id/versions/latest"
        path: "installation-id"
      - resourceName: "projects/${GCP_PROJECT}/secrets/${SECRET_PREFIX}github-arc-private-key/versions/latest"
        path: "private-key.pem"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: github-arc-github-app
  namespace: github-arc
spec:
  serviceAccountName: github-arc-secrets
  secretProviderClassName: github-arc-github-app
  secretObject:
    type: Opaque
    data:
      - sourcePath: app-id
        targetKey: github_app_id
      - sourcePath: installation-id
        targetKey: github_app_installation_id
      - sourcePath: private-key.pem
        targetKey: github_app_private_key
